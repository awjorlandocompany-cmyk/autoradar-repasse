<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoRadar Repasse - Carros com Margem Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para gerar o QR Code Pix em tempo real -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForAutoRadarRepasse",
      authDomain: "autoradar-repasse.firebaseapp.com",
      projectId: "autoradar-repasse",
      storageBucket: "autoradar-repasse.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isAdmin = false;
    let base64Image = "";
    let currentCarForPix = null;

    // Chave Pix padrão (podes alterar para a tua chave preferida)
    const CHAVE_PIX_PADRAO = "pix@autoradarrepasse.com.br";

    window.handleImageUpload = (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          base64Image = reader.result;
        };
        reader.readAsDataURL(file);
      }
    };

    window.toggleAdmin = () => {
      if (!isAdmin) {
        const password = prompt("Insira a senha de Administrador:");
        if (password === "Cel949601") {
          isAdmin = true;
          document.getElementById("admin-panel").classList.remove("hidden");
          alert("Modo Administrador Ativado!");
          renderCars(currentCars);
        } else if (password !== null) {
          alert("Senha incorreta!");
        }
      } else {
        isAdmin = false;
        document.getElementById("admin-panel").classList.add("hidden");
        renderCars(currentCars);
      }
    };

    function calcularMargemDesconto(fipeStr, repasseStr) {
      const fipeNum = parseFloat(fipeStr.replace(/[^\d]/g, '')) || 0;
      const repasseNum = parseFloat(repasseStr.replace(/[^\d]/g, '')) || 0;
      
      if (fipeNum > 0 && repasseNum > 0 && fipeNum > repasseNum) {
        const diferenca = fipeNum - repasseNum;
        const porcentagem = (diferenca / fipeNum) * 100;
        return `-${porcentagem.toFixed(0)}% abaixo da FIPE`;
      }
      return "";
    }

    window.saveCar = async (e) => {
      e.preventDefault();
      const modelo = document.getElementById("modelo").value;
      const ano = document.getElementById("ano").value;
      const fipe = document.getElementById("fipe").value;
      const repasse = document.getElementById("repasse").value;
      const lucro = document.getElementById("lucro").value;
      const local = document.getElementById("local").value;
      const whatsapp = document.getElementById("whatsapp").value;
      const inputUrl = document.getElementById("fotoUrl").value;

      const fotoFinal = base64Image || inputUrl || "https://via.placeholder.com/400x300?text=Sem+Foto";
      const descontoFipe = calcularMargemDesconto(fipe, repasse);

      try {
        await addDoc(collection(db, "veiculos"), {
          modelo, ano, fipe, repasse, lucro, local, whatsapp, foto: fotoFinal, descontoFipe,
          createdAt: new Date()
        });
        alert("Veículo publicado com sucesso!");
        document.getElementById("car-form").reset();
        base64Image = "";
      } catch (err) {
        console.error("Erro ao publicar:", err);
        alert("Erro ao salvar veículo no banco de dados.");
      }
    };

    window.deleteCar = async (id) => {
      if (confirm("Tem certeza que deseja apagar este anúncio?")) {
        try {
          await deleteDoc(doc(db, "veiculos", id));
        } catch (err) {
          console.error("Erro ao apagar:", err);
        }
      }
    };

    window.abrirModalPix = (modelo, repasse, whatsapp) => {
      currentCarForPix = { modelo, repasse, whatsapp };
      document.getElementById("pix-car-title").innerText = modelo;
      document.getElementById("pix-car-price").innerText = repasse;
      document.getElementById("pix-key-input").value = CHAVE_PIX_PADRAO;

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: `PAYMENT:${modelo}:${repasse}:${CHAVE_PIX_PADRAO}`,
        width: 180,
        height: 180,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      document.getElementById("pix-modal").classList.remove("hidden");
    };

    window.fecharModalPix = () => {
      document.getElementById("pix-modal").classList.add("hidden");
    };

    window.copiarChavePix = () => {
      const copyText = document.getElementById("pix-key-input");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Chave Pix copiada para a área de transferência!");
    };

    window.confirmarPagamentoWhats = () => {
      if (!currentCarForPix) return;
      const text = encodeURIComponent(`Olá! Já fiz o Pix de ${currentCarForPix.repasse} para garantir o ${currentCarForPix.modelo}. Segue o comprovativo.`);
      window.open(`https://wa.me/55${currentCarForPix.whatsapp.replace(/\D/g,'')}?text=${text}`, '_blank');
    };

    let currentCars = [];

    onSnapshot(collection(db, "veiculos"), (snapshot) => {
      currentCars = [];
      snapshot.forEach((doc) => {
        currentCars.push({ id: doc.id, ...doc.data() });
      });
      renderCars(currentCars);
    });

    function renderCars(cars) {
      const container = document.getElementById("cars-container");
      if (cars.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 col-span-full py-12">Nenhum carro de repasse no momento. Utilize o painel de administrador para publicar oportunidades!</p>`;
        return;
      }
      container.innerHTML = cars.map(car => `
        <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col justify-between relative">
          ${isAdmin ? `
            <button onclick="deleteCar('${car.id}')" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-2 rounded-lg text-xs font-bold z-10 shadow">
              ✕ Excluir
            </button>
          ` : ''}
          <div class="relative">
            <img src="${car.foto}" alt="${car.modelo}" class="w-full h-48 object-cover">
            ${car.descontoFipe ? `
              <span class="absolute bottom-2 left-2 bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-md shadow">
                ${car.descontoFipe}
              </span>
            ` : ''}
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <h3 class="text-xl font-bold text-white">${car.modelo}</h3>
                <span class="bg-slate-700 text-gray-300 text-xs px-2.5 py-1 rounded-full">${car.ano}</span>
              </div>
              <p class="text-gray-400 text-sm mb-4">📍 ${car.local}</p>
              
              <div class="space-y-1.5 mb-5 text-sm bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                <div class="flex justify-between text-gray-400"><span>Tabela FIPE:</span> <span class="font-medium text-white">${car.fipe}</span></div>
                <div class="flex justify-between text-emerald-400 font-semibold"><span>Preço Repasse:</span> <span>${car.repasse}</span></div>
                <div class="flex justify-between text-purple-400 font-bold border-t border-slate-800 pt-1.5"><span>Lucro Estimado:</span> <span>${car.lucro}</span></div>
              </div>
            </div>

            <button onclick="abrirModalPix('${car.modelo}', '${car.repasse}', '${car.whatsapp}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-600/20">
              ⚡ Comprar Agora (QR Code Pix)
            </button>
          </div>
        </div>
      `).join('');
    }
  </script>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-purple-500"></div>
        <h1 class="text-xl font-bold tracking-tight"><span class="text-white">AutoRadar</span> <span class="text-purple-400">Repasse</span></h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleAdmin()" class="text-gray-400 hover:text-white p-2" title="Painel Admin">
          🔒
        </button>
        <button onclick="abrirModalPix('Assinatura VIP AutoRadar', 'R$ 97,00', '11999999999')" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm px-4 py-2 rounded-lg transition shadow-lg shadow-purple-600/30">
          Assinar VIP
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Panel -->
  <div id="admin-panel" class="hidden bg-slate-800 border-b border-purple-500/30 p-6">
    <div class="max-w-7xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-purple-400 flex items-center gap-2">
          <span>⚙️</span> Painel do Administrador – Publicar Veículo
        </h2>
        <button onclick="toggleAdmin()" class="text-xs text-gray-400 hover:text-white">Sair do Modo Admin</button>
      </div>
      <form id="car-form" onsubmit="saveCar(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <input type="text" id="modelo" placeholder="Modelo do Carro (ex: Clio 1.0)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <input type="text" id="ano" placeholder="Ano (ex: 2009/2009)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <input type="text" id="fipe" placeholder="Preço Tabela FIPE (ex: R$ 18.765)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <input type="text" id="repasse" placeholder="Preço de Repasse (ex: R$ 11.500)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <input type="text" id="lucro" placeholder="Lucro Estimado (ex: R$ 7.265)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <input type="text" id="local" placeholder="Cidade/Estado (ex: Suzano - SP)" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <input type="text" id="whatsapp" placeholder="WhatsApp do Repassador com DDD" required class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        
        <div class="flex flex-col gap-1">
          <input type="file" id="fotoFile" accept="image/*" onchange="handleImageUpload(event)" class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-purple-600 file:text-white hover:file:bg-purple-500">
          <input type="text" id="fotoUrl" placeholder="Ou cole a URL da Foto" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-purple-500">
        </div>

        <button type="submit" class="col-span-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg transition mt-2">
          Publicar Carro Agora
        </button>
      </form>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-extrabold sm:text-4xl text-white">Carros de Repasse com <span class="text-purple-400">Margens Reais</span></h2>
      <p class="text-gray-400 mt-2">Acesse veículos selecionados abaixo da Tabela FIPE e garanta o seu veículo via Pix direto.</p>
    </div>

    <div id="cars-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Veículos renderizados dinamicamente -->
    </div>
  </main>

  <!-- Modal do QR Code Pix -->
  <div id="pix-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
      <button onclick="fecharModalPix()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>
      
      <div class="text-center mb-6">
        <span class="inline-block bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full mb-2">Pagamento Imediato Pix</span>
        <h3 id="pix-car-title" class="text-xl font-bold text-white">Modelo do Veículo</h3>
        <p class="text-gray-400 text-sm">Valor: <span id="pix-car-price" class="text-emerald-400 font-bold">R$ 0,00</span></p>
      </div>

      <!-- QR Code Gerado -->
      <div class="bg-white p-4 rounded-xl w-fit mx-auto mb-6 flex justify-center items-center shadow-inner">
        <div id="qrcode"></div>
      </div>

      <!-- Chave Copia e Cola -->
      <div class="space-y-3 mb-6">
        <label class="block text-xs text-gray-400 font-medium">Chave Pix Copia e Cola:</label>
        <div class="flex gap-2">
          <input type="text" id="pix-key-input" readonly class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-gray-300 w-full focus:outline-none">
          <button onclick="copiarChavePix()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2.5 rounded-lg text-xs font-semibold whitespace-nowrap transition">
            📋 Copiar
          </button>
        </div>
      </div>

      <!-- Confirmação no WhatsApp -->
      <button onclick="confirmarPagamentoWhats()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-600/30">
        Enviar Comprovante via WhatsApp
      </button>
    </div>
  </div>

</body>
</html>
