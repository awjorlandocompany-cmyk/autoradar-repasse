<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRadar Repasse | Veículos Abaixo da FIPE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-purple-600 selection:text-white">

    <div id="root"></div>

    <!-- React & Babel via CDN para rodar direto sem instalação complexa -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function App() {
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [selectedPlan, setSelectedPlan] = React.useState(null);
            const [showPixModal, setShowPixModal] = React.useState(false);

            // Base de carros de repasse (fácil de editar aqui no código!)
            const [carros] = React.useState([
                {
                    id: 1,
                    modelo: "Chevrolet Onix Plus LTZ 1.0 Turbo",
                    ano: "2023/2023",
                    fipe: "R$ 78.500",
                    precoRepasse: "R$ 68.900",
                    lucro: "R$ 9.600",
                    local: "São Bernardo do Campo - SP",
                    foto: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=800&q=80",
                    disponivel: true,
                    telefoneContato: "(11) 98765-4321"
                },
                {
                    id: 2,
                    modelo: "Honda Civic Touring 1.5 Turbo",
                    ano: "2021/2021",
                    fipe: "R$ 135.000",
                    precoRepasse: "R$ 119.900",
                    lucro: "R$ 15.100",
                    local: "São Paulo - SP",
                    foto: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80",
                    disponivel: true,
                    telefoneContato: "(11) 97123-4567"
                },
                {
                    id: 3,
                    modelo: "Jeep Compass Limited TD350 Diesel",
                    ano: "2022/2022",
                    fipe: "R$ 152.000",
                    precoRepasse: "R$ 138.000",
                    lucro: "R$ 14.000",
                    local: "Santo André - SP",
                    foto: "https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=800&q=80",
                    disponivel: false,
                    telefoneContato: "(11) 96543-2109"
                }
            ]);

            const handleSelectPlan = (plan) => {
                setSelectedPlan(plan);
                setShowPixModal(true);
            };

            const handleSimulatePayment = () => {
                setIsUnlocked(true);
                setShowPixModal(false);
                alert("Pagamento simulado com sucesso! Acesso liberado ao catálogo.");
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header */}
                    <header className="border-b border-slate-800 bg-slate-900/55 sticky top-0 z-40 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="bg-purple-600 text-white p-2 rounded-xl font-bold flex items-center justify-center shadow-lg shadow-purple-600/30">
                                    <i className="fa-solid fa-radar text-lg animate-pulse"></i>
                                </div>
                                <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-purple-400 bg-clip-text text-transparent">
                                    AutoRadar <span className="text-purple-500">Repasse</span>
                                </span>
                            </div>
                            <div>
                                {isUnlocked ? (
                                    <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                                        <i className="fa-solid fa-circle-check"></i> VIP Ativo
                                    </span>
                                ) : (
                                    <button onClick={() => document.getElementById('planos').scrollIntoView({ behavior: 'smooth' })} className="bg-purple-600 hover:bg-purple-500 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-xl transition shadow-lg shadow-purple-600/20">
                                        Assinar Acesso VIP
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="relative overflow-hidden py-16 lg:py-24 border-b border-slate-900">
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-slate-950 to-slate-950 -z-10"></div>
                        <div className="max-w-4xl mx-auto px-4 text-center">
                            <div className="inline-flex items-center gap-2 bg-purple-500/10 border border-purple-500/20 text-purple-400 px-3.5 py-1.5 rounded-full text-xs font-semibold mb-6">
                                <i className="fa-solid fa-fire text-amber-400"></i> Oportunidades Diárias Abaixo da Tabela FIPE
                            </div>
                            <h1 className="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight">
                                Encontre Carros de Repasse com <span className="bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Margens Reais</span>
                            </h1>
                            <p className="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto mb-8">
                                Tenha acesso a veículos selecionados, verifique a disponibilidade em tempo real e descubra o telefone direto de quem está a repassar.
                            </p>
                        </div>
                    </section>

                    {/* Catálogo de Veículos */}
                    <main className="flex-grow max-w-7xl mx-auto px-4 py-12 w-full">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                    <i className="fa-solid fa-car-side text-purple-500"></i> Catálogo de Oportunidades
                                </h2>
                                <p className="text-slate-400 text-sm">Veículos atualizados recentemente por parceiros e leilões.</p>
                            </div>
                            {!isUnlocked && (
                                <div className="bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs px-4 py-2 rounded-xl flex items-center gap-2">
                                    <i className="fa-solid fa-lock text-amber-400"></i> Disponibilidade e telefones bloqueados para visitantes.
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {carros.map((carro) => (
                                <div key={carro.id} className="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden flex flex-col shadow-xl hover:border-purple-500/50 transition">
                                    <div className="relative h-48 overflow-hidden bg-slate-950">
                                        <img src={carro.foto} alt={carro.modelo} className="w-full h-full object-cover" />
                                        <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2.5 py-1 rounded-lg">
                                            Lucro est. {carro.lucro}
                                        </div>
                                    </div>
                                    <div className="p-5 flex flex-col flex-grow">
                                        <span className="text-xs text-purple-400 font-semibold mb-1">{carro.ano} • {carro.local}</span>
                                        <h3 className="text-lg font-bold text-white mb-4">{carro.modelo}</h3>
                                        
                                        <div className="grid grid-cols-2 gap-2 bg-slate-950/50 p-3 rounded-xl mb-4 border border-slate-800/60">
                                            <div>
                                                <span className="text-[10px] text-slate-500 uppercase font-bold block">Tabela FIPE</span>
                                                <span className="text-sm text-slate-300 line-through">{carro.fipe}</span>
                                            </div>
                                            <div>
                                                <span className="text-[10px] text-purple-400 uppercase font-bold block">Preço Repasse</span>
                                                <span className="text-base font-extrabold text-white">{carro.precoRepasse}</span>
                                            </div>
                                        </div>

                                        {/* Área Protegida / Paywall */}
                                        <div className="mt-auto pt-4 border-t border-slate-800">
                                            {isUnlocked ? (
                                                <div className="space-y-3">
                                                    <div className="flex items-center justify-between text-xs">
                                                        <span className="text-slate-400 font-medium">Status Atual:</span>
                                                        {carro.disponivel ? (
                                                            <span className="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded flex items-center gap-1">
                                                                <i className="fa-solid fa-circle text-[8px] animate-pulse"></i> Disponível
                                                            </span>
                                                        ) : (
                                                            <span className="text-rose-400 font-bold bg-rose-500/10 px-2 py-0.5 rounded">
                                                                Vendido / Indisponível
                                                            </span>
                                                        )}
                                                    </div>
                                                    <a href={`https://wa.me/55${carro.telefoneContato.replace(/\D/g,'')}`} target="_blank" rel="noreferrer" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-600/20">
                                                        <i className="fa-brands fa-whatsapp text-sm"></i> Falar com Repassador ({carro.telefoneContato})
                                                    </a>
                                                </div>
                                            ) : (
                                                <div className="relative py-2 text-center">
                                                    <div className="absolute inset-0 backdrop-blur-sm bg-slate-950/70 z-10 flex flex-col items-center justify-center rounded-lg border border-purple-500/20">
                                                        <span className="text-xs text-purple-300 font-semibold mb-1">
                                                            <i className="fa-solid fa-lock text-purple-400"></i> Conteúdo Exclusivo
                                                        </span>
                                                        <button onClick={() => document.getElementById('planos').scrollIntoView({ behavior: 'smooth' })} className="text-[11px] text-white underline font-bold hover:text-purple-400 transition">
                                                            Desbloquear Status e Telefone
                                                        </button>
                                                    </div>
                                                    <div className="filter blur-[6px] select-none text-xs text-slate-500">
                                                        Status: Disponível • Tel: (11) 9****-****
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Planos e Preços */}
                    <section id="planos" className="py-16 bg-slate-900/40 border-t border-slate-900">
                        <div className="max-w-5xl mx-auto px-4">
                            <div className="text-center max-w-2xl mx-auto mb-12">
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-white mb-3">Escolha Seu Plano de Acesso</h2>
                                <p className="text-slate-400 text-sm">Desbloqueie agora os contatos diretos e as melhores oportunidades abaixo da FIPE.</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* Plano 1 */}
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 flex flex-col shadow-xl">
                                    <h3 className="text-lg font-bold text-white mb-2">Acesso VIP Padrão</h3>
                                    <p className="text-slate-400 text-xs mb-6">Ideal para consultar o painel e os contatos atuais.</p>
                                    <div className="mb-6">
                                        <span className="text-3xl sm:text-4xl font-extrabold text-white">R$ 49,90</span>
                                        <span className="text-slate-500 text-xs"> / mês</span>
                                    </div>
                                    <ul className="space-y-3 text-xs text-slate-300 mb-8 flex-grow">
                                        <li className="flex items-center gap-2"><i className="fa-solid fa-check text-purple-400"></i> Catálogo completo de repasses</li>
                                        <li className="flex items-center gap-2"><i className="fa-solid fa-check text-purple-400"></i> Status de disponibilidade real</li>
                                        <li className="flex items-center gap-2"><i className="fa-solid fa-check text-purple-400"></i> Telefone direto do repassador</li>
                                    </ul>
                                    <button onClick={() => handleSelectPlan('Padrao')} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs sm:text-sm transition border border-slate-700">
                                        Garantir Acesso Padrão
                                    </button>
                                </div>

                                {/* Plano 2 - Destacado com Alerta Diário */}
                                <div className="bg-gradient-to-b from-purple-950/40 to-slate-900 border-2 border-purple-500 rounded-3xl p-6 sm:p-8 flex flex-col shadow-2xl relative">
                                    <div className="absolute -top-3.5 right-6 bg-purple-600 text-white font-extrabold text-[10px] uppercase tracking-wider px-3 py-1 rounded-full shadow-lg">
                                        Mais Recomendado 🚀
                                    </div>
                                    <h3 className="text-lg font-bold text-white mb-2">Passaporte VIP Diário + WhatsApp</h3>
                                    <p className="text-purple-300 text-xs mb-6">Receba as oportunidades fresquinhas todos os dias diretamente com a Cris.</p>
                                    <div className="mb-6">
                                        <span className="text-3xl sm:text-4xl font-extrabold text-white">R$ 59,90</span>
                                        <span className="text-slate-400 text-xs"> / mês</span>
                                    </div>
                                    <ul className="space-y-3 text-xs text-slate-200 mb-8 flex-grow">
                                        <li className="flex items-center gap-2"><i className="fa-solid fa-check text-purple-400"></i> Tudo do Plano Padrão incluso</li>
                                        <li className="flex items-center gap-2"><i className="fa-solid fa-check text-purple-400"></i> <strong>Lista e fotos de carros todos os dias</strong></li>
                                        <li className="flex items-center gap-2"><i className="fa-solid fa-check text-purple-400"></i> Envio automático no WhatsApp pela Cris</li>
                                    </ul>
                                    <button onClick={() => handleSelectPlan('WhatsApp')} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs sm:text-sm transition shadow-lg shadow-purple-600/30">
                                        Quero Receber no WhatsApp
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Modal de Pagamento PIX */}
                    {showPixModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 relative shadow-2xl text-center">
                                <button onClick={() => setShowPixModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-xl font-bold text-white mb-2">Pagamento via PIX</h3>
                                <p className="text-xs text-slate-400 mb-6">
                                    Plano Selecionado: <strong className="text-purple-400">{selectedPlan === 'WhatsApp' ? 'Passaporte VIP + WhatsApp (R$ 59,90)' : 'Acesso VIP Padrão (R$ 49,90)'}</strong>
                                </p>
                                
                                <div className="bg-white p-4 rounded-2xl inline-block mb-4 shadow-inner">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=AutoRadarRepassePIX" alt="QR Code PIX" className="w-40 h-40 mx-auto" />
                                </div>

                                <p className="text-xs text-slate-400 mb-6">Escaneie o QR Code com o aplicativo do seu banco ou clique no botão abaixo para simular a aprovação.</p>

                                <button onClick={handleSimulatePayment} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs sm:text-sm transition shadow-lg shadow-emerald-600/20">
                                    Simular Pagamento Aprovado
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="border-t border-slate-900 py-8 text-center text-xs text-slate-500">
                        <p>© 2026 AutoRadar Repasse. Todos os direitos reservados.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
